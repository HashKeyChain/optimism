[package]
name = "hsk-b20-precompiles"
description = "Base Beryl B20 v1 core precompiles for HSK"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
alloy-evm.workspace = true
alloy-sol-types.workspace = true
alloy-primitives.workspace = true
b20-precompile-macros.workspace = true
b20-precompile-storage.workspace = true
revm.workspace = true

[dev-dependencies]
rstest.workspace = true
criterion.workspace = true
k256 = { workspace = true, features = ["ecdsa"] }
b20-precompile-storage = { workspace = true, features = ["test-utils"] }

[[test]]
name = "b20_stablecoin_v1_golden"
required-features = ["test-utils"]

[[test]]
name = "b20_asset_v1_golden"
required-features = ["test-utils"]

[[test]]
name = "b20_policy_v1_golden"
required-features = ["test-utils"]

[[test]]
name = "b20_factory_v1_golden"
required-features = ["test-utils"]

[features]
default = ["std"]
std = [
  "alloy-evm/std",
  "alloy-primitives/std",
  "alloy-sol-types/std",
  "b20-precompile-storage/std",
  "revm/std",
]
test-utils = ["b20-precompile-storage/test-utils"]
